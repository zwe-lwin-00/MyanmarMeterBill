name: myanmar_meter_bill
description: Myanmar electricity bill estimator (home vs business tiered tariffs).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

# Source art: web/icons/AppIcon-clean.png — then run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: web/icons/AppIcon-clean.png
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/config/
